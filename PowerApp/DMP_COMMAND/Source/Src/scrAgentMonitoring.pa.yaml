Screens:
  scrAgentMonitoring:
    Properties:
      Fill: =If(varDarkMode,RGBA(11,11,13,1),RGBA(243,243,243,1))
      LoadingSpinnerColor: =RGBA(0, 206, 125, 1)
      OnVisible: |-
        =Set(varAgentMonitoringRefreshing, true);
        Refresh('DMP Command Agent Status');
        Set(varAgentMonitoringRefreshing, false);
        Set(varAgentMonitoringEverLoaded, true)
    Children:
      - conAgentMonitoringRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =If(varDarkMode,RGBA(11,11,13,1),RGBA(243,243,243,1))
            Height: =Parent.Height
            Width: =Parent.Width
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =16
          Children:
            - conAgentMonitoringHeader:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =RGBA(32,23,81,1)
                  Height: =72
                  LayoutMaxHeight: =72
                  LayoutMinHeight: =72
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                Children:
                  - btnBackToCockpitFromAgentMonitoring:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(255,255,255,1)
                        Fill: =RGBA(255,255,255,0.12)
                        Font: =Font.'Arial'
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        HoverFill: =RGBA(255,255,255,0.22)
                        OnSelect: =Navigate(scrHome, ScreenTransition.None)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="< Back to Cockpit"
                        Width: =190
                        X: =20
                        Y: =18
                  - lblAgentMonitoringPageTitle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(255,255,255,1)
                        Font: =Font.'Arial'
                        FontWeight: =FontWeight.Bold
                        Height: =31
                        Size: =20
                        Text: ="Agent Monitoring"
                        Width: =500
                        Wrap: =false
                        X: =230
                        Y: =12
                  - lblAgentMonitoringPageSubtitle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(215,210,235,1)
                        Font: =Font.'Arial'
                        Height: =20
                        Size: =11.5
                        Text: ="DMP COMMAND - detailed per-agent health and metrics"
                        Width: =500
                        Wrap: =false
                        X: =230
                        Y: =42
