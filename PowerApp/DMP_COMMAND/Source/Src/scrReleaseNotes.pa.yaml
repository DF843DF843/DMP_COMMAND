Screens:
  scrReleaseNotes:
    Properties:
      Fill: =If(varDarkMode,RGBA(11,11,13,1),RGBA(243,243,243,1))
      LoadingSpinnerColor: =RGBA(0, 206, 125, 1)
    Children:
      - conReleaseNotesRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =If(varDarkMode,RGBA(11,11,13,1),RGBA(243,243,243,1))
            Height: =Parent.Height
            Width: =Parent.Width
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =16
          Children:
            - conReleaseNotesHeader:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =RGBA(32,23,81,1)
                  Height: =72
                  LayoutMaxHeight: =72
                  LayoutMinHeight: =72
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                Children:
                  - btnBackToCockpitFromReleaseNotes:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(255,255,255,1)
                        Fill: =RGBA(255,255,255,0.12)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        HoverFill: =RGBA(255,255,255,0.22)
                        OnSelect: =Navigate(scrHome, ScreenTransition.None)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="< Back to Cockpit"
                        Width: =190
                        X: =20
                        Y: =18
                  - lblReleaseNotesTitle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(255,255,255,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =31
                        Size: =20
                        Text: ="Release Notes - Version History"
                        Width: =500
                        Wrap: =false
                        X: =230
                        Y: =12
                  - lblReleaseNotesSubtitle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(215,210,235,1)
                        Font: =Font.'Segoe UI'
                        Height: =20
                        Size: =11.5
                        Text: ="DMP COMMAND - current version " & varAppVersion
                        Width: =500
                        Wrap: =false
                        X: =230
                        Y: =42
                  - btnCopyReleaseNotesToClipboard:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(11,11,13,1)
                        Fill: =RGBA(0,206,125,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        HoverFill: =RGBA(45,230,155,1)
                        OnSelect: |-
                          =IfError(
                              Copy(
                                  lblReleaseV1100Header.Text & Char(10) & lblReleaseV1100Notes.Text & Char(10) & Char(10) &
                                  lblReleaseV190Header.Text & Char(10) & lblReleaseV190Notes.Text & Char(10) & Char(10) &
                                  lblReleaseV180Header.Text & Char(10) & lblReleaseV180Notes.Text & Char(10) & Char(10) &
                                  lblReleaseV170Header.Text & Char(10) & lblReleaseV170Notes.Text & Char(10) & Char(10) &
                                  lblReleaseV164Header.Text & Char(10) & lblReleaseV164Notes.Text & Char(10) & Char(10) &
                                  lblReleaseV161to163Header.Text & Char(10) & lblReleaseV161to163Notes.Text & Char(10) & Char(10) &
                                  lblReleaseOlderHeader.Text & Char(10) & lblReleaseOlderNotes.Text
                              ),
                              Notify("Release Notes wurden in die Zwischenablage kopiert.", NotificationType.Success),
                              Notify("Kopieren in die Zwischenablage ist in diesem Kontext nicht verfuegbar.", NotificationType.Warning)
                          )
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Copy to Clipboard"
                        Width: =190
                        X: =Parent.Width - 210
                        Y: =18
            - conReleaseNotesTabs:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =RGBA(0,0,0,0)
                  Height: =40
                  LayoutMaxHeight: =40
                  LayoutMinHeight: =40
                Children:
                  - btnReleaseNotesTabApp:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =If(varReleaseNotesTab="App",RGBA(11,11,13,1),If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1)))
                        Fill: =If(varReleaseNotesTab="App",RGBA(0,206,125,1),If(varDarkMode,RGBA(255,255,255,0.06),RGBA(32,23,81,0.05)))
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        HoverFill: =If(varReleaseNotesTab="App",RGBA(45,230,155,1),If(varDarkMode,RGBA(255,255,255,0.12),RGBA(32,23,81,0.1)))
                        OnSelect: =Set(varReleaseNotesTab,"App")
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="App Changes"
                        Width: =160
                        X: =0
                        Y: =0
                  - btnReleaseNotesTabAgents:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =If(varReleaseNotesTab="Agents",RGBA(11,11,13,1),If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1)))
                        Fill: =If(varReleaseNotesTab="Agents",RGBA(0,206,125,1),If(varDarkMode,RGBA(255,255,255,0.06),RGBA(32,23,81,0.05)))
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        HoverFill: =If(varReleaseNotesTab="Agents",RGBA(45,230,155,1),If(varDarkMode,RGBA(255,255,255,0.12),RGBA(32,23,81,0.1)))
                        OnSelect: =Set(varReleaseNotesTab,"Agents")
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Agent (Flow) Changes"
                        Width: =200
                        X: =168
                        Y: =0
            - conReleaseNotesList:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Visible: =varReleaseNotesTab="App"
                  Fill: =RGBA(0,0,0,0)
                  FillPortions: =1
                  Height: =Parent.Height - 176
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutMaxHeight: =Parent.Height - 176
                  LayoutMinHeight: =Parent.Height - 176
                  LayoutOverflowY: =LayoutOverflow.Scroll
                Children:
                  - conReleaseV1100:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0,206,125,0.5)
                        BorderThickness: =2
                        Fill: =If(varDarkMode,RGBA(255,255,255,0.06),RGBA(32,23,81,0.05))
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMaxHeight: =280
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblReleaseV1100Header:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0,206,125,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              Size: =16
                              Text: ="v1.11.0 - 2026-09-01 (current)"
                              Wrap: =false
                        - lblReleaseV1100Notes:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                              Font: =Font.'Segoe UI'
                              Height: =700
                              Size: =12
                              Text: ="- New - direct SharePoint connections added for ""DMP Command Configuration"", ""DMP Command Agent Status"" and the brand-new ""DMP Command Internal Domains"" list (Title/Active columns)" & Char(10) & "- Internal Domains management now reads/links directly to the new SharePoint list (count + View/Edit buttons) instead of the old flat text file - backend agents still write the text file for now, that migration is planned separately" & Char(10) & "- Automation Status redesigned as a compact 4-line panel (Agent 4 Live Status, Internal Domains active count, Config Parameters active count, Agent Status entries count), moved into the former ""Reserved for future use"" tile" & Char(10) & "- Removed the old separate Automation Status checklist section (generic manual next-step items) to make room - see backlog for the removed items" & Char(10) & "- All container gaps unified to a single, minimal 8px spacing (previously a mix of 8/16px)" & Char(10) & "- Maintenance Domains - removed the extra dashes around INTERNAL/EXTERNAL, widened the labels, narrowed the card to match Operating State's width" & Char(10) & "- Files card narrowed further, tighter column spacing" & Char(10) & "- System Health / Emails Processed rings resized so their combined card height lines up exactly with Operating State + Maintenance Domains" & Char(10) & "- System Health ring - the plain-text tooltip was unreliable (sometimes showed nothing at all), replaced with the same click-to-open colour legend popup already used on Emails Processed" & Char(10) & "- Release Notes list scrollbar fix - it needed an explicit calculated height, not just automatic space-sharing, to actually start scrolling" & Char(10) & "- Fixed a recurring backend issue where the Agent 4 connection had to be manually deleted and re-added after almost every deployment - traced to a stale internal reference that is now kept in sync" & Char(10) & "- v1.10.1 - Release Notes cards still cut off long text - AutoHeight alone was not reliable, so each card now has its own fixed max height with a scrollbar (in addition to the outer list scrollbar)" & Char(10) & "- v1.10.1 - Automation Status - fixed the third bullet (Config Parameters) showing no text at all - the Active column in DMP Command Configuration is a Choice field, needed .Value" & Char(10) & "- v1.10.1 - Automation Status tile border changed to solid green to match all other Cockpit cards (was still the old dashed placeholder style)" & Char(10) & "- v1.10.1 - Agent 6 (Admin Functions) was stuck in Draft/Inactive state in Dataverse, which made it show up oddly in the Power Automate panel - activated" & Char(10) & "- v1.10.2 - Release Notes now also has an ""Agent (Flow) Changes"" tab alongside ""App Changes"", listing each agent's current version and recent changes" & Char(10) & "- v1.10.2 - Replace button LED - the ""processing"" yellow blink never actually rendered because the upload and the flow call ran in the same formula with no repaint in between; the flow call now runs a moment later via a timer so the blink is visible" & Char(10) & "- v1.10.2 - All green status dots across the Cockpit (Files, Automation Status, System Health legend, Maintenance Domains) are now the same size and shape (14px circles) - previously a mix of text bullets and different-radius shapes" & Char(10) & "- v1.10.2 - Maintenance Domains - added a status dot in front of the count, matching the Files/Automation Status pattern" & Char(10) & "- v1.10.2 - Maintenance Domains - Edit now opens a quick ""add new domain"" form instead of duplicating the View link" & Char(10) & "- v1.10.2 - Header bar width aligned with the card row and Next Steps width for a clean edge-to-edge look" & Char(10) & "- v1.11.0 - Agent Monitoring page filled in - 6 tiles (one per agent) showing live status, last run result/duration, and status message straight from the DMP Command Agent Status SharePoint list"
                              Wrap: =true
                  - conReleaseV190:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0,206,125,0.5)
                        BorderThickness: =2
                        Fill: =If(varDarkMode,RGBA(255,255,255,0.06),RGBA(32,23,81,0.05))
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMaxHeight: =280
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblReleaseV190Header:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0,206,125,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              Size: =16
                              Text: ="v1.9.3 - 2026-08-28"
                              Wrap: =false
                        - lblReleaseV190Notes:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                              Font: =Font.'Segoe UI'
                              Height: =700
                              Size: =12
                              Text: ="- Files and Maintenance Domains swapped positions (Files now top-right, Maintenance Domains bottom-left)" & Char(10) & "- Files - removed the Internal Domains row (redundant with Maintenance Domains), widened Name/Status/Last Updated columns to stop text truncation" & Char(10) & "- Maintenance Domains - compact new layout - count (green) - LOCATION - actions, e.g. ""19 - INTERNAL - View Edit"" and ""6 - EXTERNAL - View Edit Replace""" & Char(10) & "- Operating State - ""Operational Mode"" caption shortened to ""MODE""" & Char(10) & "- Change-notification LEDs (Critical/Warnings/Agents Active) - added a large invisible click area covering the whole tile including the LED itself - previously only the small number/label caught the click, making the LED very hard to tap" & Char(10) & "- v1.9.1 - added the missing second dash (between location and actions) to the Maintenance Domains format" & Char(10) & "- v1.9.2 - enlarged the invisible click area of the Replace button (Maintenance Domains - External) - was only slightly larger than the visible button, now has a generous margin on all sides without overlapping the neighboring Edit button or LED" & Char(10) & "- v1.9.3 - Release Notes text was getting cut off on longer entries - all entries now auto-size to their real content height" & Char(10) & "- v1.9.3 - Release Notes list is now scrollable, and a new ""Copy to Clipboard"" button copies the full version history as plain text" & Char(10) & "- v1.9.3 - Files card - right edge was poking out past its container on some screens - narrowed the card and tightened the Status/Last Updated column gaps further" & Char(10) & "- v1.9.3 - Heartbeat and Emails Processed ring cards - reduced the inner padding further to save horizontal space" & Char(10) & "- v1.9.3 - Emails Processed ring - the old plain-text tooltip could not show colours, so it was replaced with a click-to-open legend popup with real colour swatches matching each ring segment"
                              Wrap: =true
                  - conReleaseV180:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0,206,125,0.5)
                        BorderThickness: =2
                        Fill: =If(varDarkMode,RGBA(255,255,255,0.06),RGBA(32,23,81,0.05))
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMaxHeight: =280
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblReleaseV180Header:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0,206,125,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              Size: =16
                              Text: ="v1.8.1 - 2026-08-28"
                              Wrap: =false
                        - lblReleaseV180Notes:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                              Font: =Font.'Segoe UI'
                              Height: =700
                              Size: =12
                              Text: ="- Sidebar logo fixed - the source image had ~20-25% built-in padding on every side, so no resize ever actually made it bigger; it is now cropped to the real artwork and fills the sidebar width" & Char(10) & "- Major width reduction across the whole Cockpit header row to fit 100% browser zoom (was previously only fully visible at 75%) - narrower Operating State / Maintenance Domains / Files columns, narrower buttons, smaller ring padding, tighter gaps, narrower sidebar" & Char(10) & "- Operating State - ""Mode"" merged into the title area (color-coded like the screen border, blinks while switching), all labels made smaller/consistent, matching the Files card style" & Char(10) & "- Emails card - legend converted to a tooltip on the ring itself, so the ring can stay full size while the card gets much narrower" & Char(10) & "- Light mode - several too-light grey texts (Files status/time, Maintenance Domains counts) darkened for readability" & Char(10) & "- New diagnostics tile on the Admin page showing App.Width/App.Height for reporting layout issues" & Char(10) & "- v1.8.1 - fixed a sibling-indentation bug in this very file that blocked Studio from opening v1.8.0"
                              Wrap: =true
                  - conReleaseV170:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(120,115,140,0.35)
                        BorderThickness: =1
                        Fill: =If(varDarkMode,RGBA(255,255,255,0.03),RGBA(32,23,81,0.03))
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMaxHeight: =280
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblReleaseV170Header:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0,206,125,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              Size: =16
                              Text: ="v1.7.0 - 2026-08-28"
                              Wrap: =false
                        - lblReleaseV170Notes:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                              Font: =Font.'Segoe UI'
                              Height: =700
                              Size: =12
                              Text: ="- Every sidebar menu item now has its own real screen instead of a ""coming next"" popup - Admin Functions moved to its own page, and Agent Monitoring / Operational Board / Audit Trail (Detail) / Configuration (Lists) / Maintenance each got a first ""Coming Soon"" placeholder screen (content to be filled in step by step)" & Char(10) & "- New change-notification LEDs on the Critical / Warnings / Agents Active header tiles - a small blue LED lights up (blinking) whenever one of these values changes since you last acknowledged it - click the tile to acknowledge; a new warning or critical lights the LED again automatically" & Char(10) & "- Version badge (top right) now links to this Release Notes page"
                              Wrap: =true
                  - conReleaseV164:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(120,115,140,0.35)
                        BorderThickness: =1
                        Fill: =If(varDarkMode,RGBA(255,255,255,0.03),RGBA(32,23,81,0.03))
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMaxHeight: =280
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblReleaseV164Header:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0,206,125,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              Size: =16
                              Text: ="v1.6.4 - 2026-08-28"
                              Wrap: =false
                        - lblReleaseV164Notes:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                              Font: =Font.'Segoe UI'
                              Height: =700
                              Size: =12
                              Text: ="Frontend:" & Char(10) & "- Sidebar logo enlarged (280x188 -> 288x194 px), sidebar padding reduced" & Char(10) & "- Emails card (Agent 2 status) narrowed from 620 to 560px" & Char(10) & "- Next Steps - milestone text line-wrap fixed" & Char(10) & "- Display glitch during loading (garbled characters) fixed" & Char(10) & "- Reverted an over-aggressive container shrink that had truncated labels" & Char(10) & Char(10) & "Backend:" & Char(10) & "- New Error-ID system (e.g. [EC:A2-MBOXFOLDER-ND]) added across all 5 agents for faster troubleshooting" & Char(10) & "- Agent 1 & 2 performance improved (Excel counters now batched instead of updated per email)" & Char(10) & "- False ""folder already exists"" alarm fixed in Agent 3 & 4" & Char(10) & "- Copy-paste bug in Agent 1's error-mail move action fixed"
                              Wrap: =true
                        - imgReleaseV164Screenshot:
                            Control: Image@2.2.3
                            Properties:
                              BorderColor: =RGBA(120,115,140,0.4)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Height: =446
                              Image: |-
                                ="data:image/png;base64,"
                              ImagePosition: =ImagePosition.Fit
                              Width: =900
                        - lblReleaseV164ScreenshotCaption:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(150,145,170,1)
                              Font: =Font.'Segoe UI'
                              Height: =18
                              Size: =10
                              Text: ="Screenshot v1.6.4 (75% browser zoom)"
                              Wrap: =false
                  - conReleaseV161to163:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(120,115,140,0.35)
                        BorderThickness: =1
                        Fill: =If(varDarkMode,RGBA(255,255,255,0.03),RGBA(32,23,81,0.03))
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMaxHeight: =280
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblReleaseV161to163Header:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              Size: =16
                              Text: ="v1.6.1 - v1.6.3 - 2026-08-27/28"
                              Wrap: =false
                        - lblReleaseV161to163Notes:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                              Font: =Font.'Segoe UI'
                              Height: =40
                              Size: =12
                              Text: ="- Emails card visibility issue fixed (layout width)" & Char(10) & "- Several intermediate width-tuning iterations (superseded by v1.6.4)"
                              Wrap: =true
                  - conReleaseOlder:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
