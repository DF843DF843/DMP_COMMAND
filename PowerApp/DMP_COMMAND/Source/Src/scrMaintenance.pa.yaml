Screens:
  scrMaintenance:
    Properties:
      Fill: =If(varDarkMode,RGBA(11,11,13,1),RGBA(243,243,243,1))
      LoadingSpinnerColor: =RGBA(0, 206, 125, 1)
    Children:
      - conMaintenanceRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =If(varDarkMode,RGBA(11,11,13,1),RGBA(243,243,243,1))
            Height: =Parent.Height
            Width: =Parent.Width
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =16
          Children:
            - conMaintenanceHeader:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =RGBA(32,23,81,1)
                  Height: =72
                  LayoutMaxHeight: =72
                  LayoutMinHeight: =72
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                Children:
                  - btnBackToCockpitFromMaintenance:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(255,255,255,1)
                        Fill: =RGBA(255,255,255,0.12)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        HoverFill: =RGBA(255,255,255,0.22)
                        OnSelect: =Navigate(scrHome, ScreenTransition.None)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="< Back to Cockpit"
                        Width: =190
                        X: =20
                        Y: =18
                  - lblMaintenancePageTitle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(255,255,255,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =31
                        Size: =20
                        Text: ="Maintenance"
                        Width: =500
                        Wrap: =false
                        X: =230
                        Y: =12
                  - lblMaintenancePageSubtitle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(215,210,235,1)
                        Font: =Font.'Segoe UI'
                        Height: =20
                        Size: =11.5
                        Text: ="DMP COMMAND - connection diagnostics, versions and admin links"
                        Width: =500
                        Wrap: =false
                        X: =230
                        Y: =42
            - conMaintenanceDiagnostics:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,206,125,0.7)
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =3
                  Fill: =If(varDarkMode,RGBA(255,255,255,0.06),RGBA(32,23,81,0.05))
                  FillPortions: =0
                  Height: =210
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                Children:
                  - lblMaintenanceDiagnosticsTitle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(0,206,125,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =22
                        Size: =14
                        Text: ="Connection diagnostics"
                        Width: =480
                        Wrap: =false
                        X: =16
                        Y: =14
                  - dotMaintenanceConfigConn:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        Fill: =IfError(If(CountRows('DMP Command Configuration')>=0,RGBA(0,206,125,1)),RGBA(255,69,58,1))
                        Height: =14
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Width: =14
                        X: =16
                        Y: =50
                  - lblMaintenanceConfigConn:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                        Font: =Font.'Segoe UI'
                        Height: =18
                        Size: =11.5
                        Text: ="DMP Command Configuration list - reachable"
                        Width: =460
                        Wrap: =false
                        X: =38
                        Y: =47
                  - dotMaintenanceAgentStatusConn:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        Fill: =IfError(If(CountRows('DMP Command Agent Status')>=0,RGBA(0,206,125,1)),RGBA(255,69,58,1))
                        Height: =14
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Width: =14
                        X: =16
                        Y: =76
                  - lblMaintenanceAgentStatusConn:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                        Font: =Font.'Segoe UI'
                        Height: =18
                        Size: =11.5
                        Text: ="DMP Command Agent Status list - reachable"
                        Width: =460
                        Wrap: =false
                        X: =38
                        Y: =73
                  - dotMaintenanceInternalDomainsConn:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        Fill: =IfError(If(CountRows('DMP Command Internal Domains')>=0,RGBA(0,206,125,1)),RGBA(255,69,58,1))
                        Height: =14
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Width: =14
                        X: =16
                        Y: =102
                  - lblMaintenanceInternalDomainsConn:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                        Font: =Font.'Segoe UI'
                        Height: =18
                        Size: =11.5
                        Text: ="DMP Command Internal Domains list - reachable"
                        Width: =460
                        Wrap: =false
                        X: =38
                        Y: =99
                  - lblMaintenanceDiagnosticsHint:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =If(varDarkMode,RGBA(154,154,160,1),RGBA(90,88,100,1))
                        Font: =Font.'Segoe UI'
                        Height: =40
                        Size: =10.5
                        Text: ="A red dot here means the app itself lost its SharePoint connection - refresh the app or check the connection under Power Apps > Settings."
                        Width: =700
                        Wrap: =true
                        X: =16
                        Y: =126
            - conMaintenanceVersions:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,206,125,0.7)
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =3
                  Fill: =If(varDarkMode,RGBA(255,255,255,0.06),RGBA(32,23,81,0.05))
                  FillPortions: =0
                  Height: =120
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                Children:
                  - lblMaintenanceVersionsTitle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(0,206,125,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =22
                        Size: =14
                        Text: ="Versions"
                        Width: =480
                        Wrap: =false
                        X: =16
                        Y: =14
                  - btnMaintenanceAppVersion:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(0,206,125,1)
                        Fill: =RGBA(0,0,0,0)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        HoverColor: =RGBA(45,230,155,1)
                        HoverFill: =RGBA(0,0,0,0)
                        OnSelect: =Navigate(scrReleaseNotes, ScreenTransition.None)
                        Size: =12
                        Text: ="Cockpit app:" & " " & varAppVersion & " (see Release Notes)"
                        Tooltip: ="Open Release Notes"
                        Width: =320
                        X: =16
                        Y: =44
                  - lblMaintenanceAgentVersionsHint:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =If(varDarkMode,RGBA(154,154,160,1),RGBA(90,88,100,1))
                        Font: =Font.'Segoe UI'
                        Height: =36
                        Size: =11
                        Text: ="Agent versions - see Release Notes > Agent Changes, or Agent Monitoring for live per-agent status"
                        Width: =700
                        Wrap: =true
                        X: =16
                        Y: =70
            - conMaintenanceLinks:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,206,125,0.7)
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =3
                  Fill: =If(varDarkMode,RGBA(255,255,255,0.06),RGBA(32,23,81,0.05))
                  FillPortions: =0
                  Height: =100
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                Children:
                  - lblMaintenanceLinksTitle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(0,206,125,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =22
                        Size: =14
                        Text: ="Admin portal links"
                        Width: =480
                        Wrap: =false
                        X: =16
                        Y: =14
                  - btnMaintenanceLinkPowerAutomate:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0,206,125,0.6)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Color: =RGBA(0,206,125,1)
                        Fill: =RGBA(0,0,0,0)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        HoverFill: =RGBA(0,206,125,0.12)
                        OnSelect: =Launch("https://make.powerautomate.com/environments/53617fa1-2ee3-e3c9-99ba-c508b1a68246/flows")
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =12
                        Text: ="Power Automate flows"
                        Width: =260
                        Wrap: =false
                        X: =16
                        Y: =48
                  - btnMaintenanceLinkSharePoint:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0,206,125,0.6)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Color: =RGBA(0,206,125,1)
                        Fill: =RGBA(0,0,0,0)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        HoverFill: =RGBA(0,206,125,0.12)
                        OnSelect: =Launch("https://deutscheboerse.sharepoint.com/teams/GO365_DMPCommunication")
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =12
                        Text: ="SharePoint site"
                        Width: =260
                        Wrap: =false
                        X: =296
                        Y: =48
                  - btnMaintenanceLinkMaker:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0,206,125,0.6)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Color: =RGBA(0,206,125,1)
                        Fill: =RGBA(0,0,0,0)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        HoverFill: =RGBA(0,206,125,0.12)
                        OnSelect: =Launch("https://make.powerapps.com/environments/53617fa1-2ee3-e3c9-99ba-c508b1a68246/home")
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =12
                        Text: ="Power Apps maker portal"
                        Width: =260
                        Wrap: =false
                        X: =576
                        Y: =48
