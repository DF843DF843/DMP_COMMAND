                        - conAdminDeleteRow:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(0,0,0,0)
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMaxHeight: =44
                              LayoutMinHeight: =44
                            Children:
                              - lblAdminDeleteLabel:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0,0,0,0)
                                    BorderStyle: =BorderStyle.None
                                    Color: =If(varDarkMode,RGBA(255,255,255,1),RGBA(20,20,24,1))
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    Height: =28
                                    Size: =12
                                    Text: ="Delete 'PA Processed Mails' folder tree"
                              - btnAdminDeleteProcessedMailsFolder:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =RGBA(0,0,0,0)
                                    BorderStyle: =BorderStyle.None
                                    Color: =RGBA(255,255,255,1)
                                    Fill: =RGBA(220,53,69,1)
                                    Font: =Font.'Segoe UI'
                                    Height: =32
                                    HoverFill: =RGBA(189,45,59,1)
