Screens:
  scrHome:
    Properties:
      Fill: =If(varDarkMode,RGBA(11,11,13,1),RGBA(243,243,243,1))
      LoadingSpinnerColor: =RGBA(0, 206, 125, 1)
      OnVisible: |-
        =If(
            !varInitialRefreshDone,
            Set(varInitialRefreshDone, true);
            Set(varLastAttemptTimestamp, Now());
            Set(varStatusCallError, "");
            Set(varIsRefreshing, true);
            Set(
                varStatusResult,
                IfError(
                    'DMPAgent4(StatusCheck)=>VS'.Run(),
                    Set(varStatusCallError, FirstError.Message);
                    Blank()
                )
            );
            Set(varIsRefreshing, false);
            Refresh('DMP Command Agent Status');
            Refresh('DMP Command Configuration');
            Refresh('DMP Command Internal Domains');
            Refresh('DMP Command Counters');
            Refresh('DMP Command External Domains');
            Set(varStatusLastRefreshed, If(varStatusCallError="", Now(), varStatusLastRefreshed));
            Set(varIsRealDMP, Coalesce(varStatusResult.isrealdmp, varIsRealDMP));
            Set(varEmergencyReportExists, Coalesce(varStatusResult.emergencyreportexists, varEmergencyReportExists));
            Set(varEmergencyReportLastModified, Coalesce(varStatusResult.emergencyreportlastmodified, varEmergencyReportLastModified));
            Set(varInternalDomainsExists, Coalesce(varStatusResult.internaldomainsexists, varInternalDomainsExists));
            Set(varInternalDomainsCount, Coalesce(varStatusResult.internaldomainscount, varInternalDomainsCount));
            Set(varInternalDomainsLastModified, Coalesce(varStatusResult.internaldomainslastmodified, varInternalDomainsLastModified));
            Set(varExternalDomainsExists, Coalesce(varStatusResult.externaldomainsexists, varExternalDomainsExists));
            Set(varExternalDomainsCount, Coalesce(varStatusResult.externaldomainscount, varExternalDomainsCount));
            Set(varExternalDomainsLastModified, Coalesce(varStatusResult.externaldomainslastmodified, varExternalDomainsLastModified));
            Set(varCounterExists, Coalesce(varStatusResult.counterexists, varCounterExists));
            Set(varCounterNoDMP, Coalesce(varStatusResult.counternodmp, varCounterNoDMP));
            Set(varCounterInternalSender, Coalesce(varStatusResult.counterinternalsender, varCounterInternalSender));
            Set(varCounterNotEffected, Coalesce(varStatusResult.counternoteffected, varCounterNotEffected));
            Set(varCounterEffected, Coalesce(varStatusResult.countereffected, varCounterEffected));
            Set(varCounterLastModified, Coalesce(varStatusResult.counterlastmodified, varCounterLastModified));
            Set(varAuditTrailExists, Coalesce(varStatusResult.audittrailexists, varAuditTrailExists));
            Set(varAuditLastModified, Coalesce(varStatusResult.auditlastmodified, varAuditLastModified));
            Set(varAuditRunSummaryCount, IfError(Coalesce(varStatusResult.auditrunsummarycount, varAuditRunSummaryCount), varAuditRunSummaryCount));
            Set(varAuditWarningCount, IfError(Coalesce(varStatusResult.auditwarningcount, varAuditWarningCount), varAuditWarningCount));
            Set(varAuditFailedCount, IfError(Coalesce(varStatusResult.auditfailedcount, varAuditFailedCount), varAuditFailedCount));
            Set(varCriticalCounterBaseline, IfError(Coalesce(varStatusResult.criticalcounterbaseline, varCriticalCounterBaseline), varCriticalCounterBaseline));
            Set(varWarningCounterBaseline, IfError(Coalesce(varStatusResult.warningcounterbaseline, varWarningCounterBaseline), varWarningCounterBaseline));
            Set(varAppVersion, Coalesce(varStatusResult.appversion, varAppVersion));
            Set(varAgent6Healthy, Coalesce(varStatusResult.agent6healthy, varAgent6Healthy));
            Set(varNextMilestones, If(IsBlank(varStatusResult.nextmilestones), varNextMilestones, varStatusResult.nextmilestones));
            Set(
                varAgentsHealthyCount,
                If(varEmergencyReportExists,1,0) +
                If(varInternalDomainsExists,1,0) +
                If(varExternalDomainsExists,1,0) +
                If(varCounterExists,1,0) +
                If(varAuditTrailExists,1,0) +
                If(varAgent6Healthy,1,0)
            );
            Set(varSystemHealthPercent, RoundUp((varAgentsHealthyCount / 6) * 100, 0));
            Set(varOperationalModeIsDMP, EndsWith(Coalesce(varStatusResult.currentoperationmode, "PROD_NODMP"), "_DMP"));
            Set(varEnvironmentIsPROD, StartsWith(Coalesce(varStatusResult.currentoperationmode, "PROD_NODMP"), "PROD"));
            // Toggle.Default is only an INITIAL value in Power Apps - once a Classic/Toggle has rendered,
            // it does not reliably re-sync its visual position when the variable behind Default changes
            // from OUTSIDE the toggle's own OnCheck/OnUncheck (e.g. here, from a background refresh).
            // Force an explicit re-sync every time these values are refreshed from live data - but ONLY
            // when no user-driven toggle click is currently in flight (varSuppressToggleEvents=true while
            // OnCheck/OnUncheck is awaiting its own flow call), else this Reset() would yank the toggle
            // back to the stale pre-click value in the middle of that call, cancelling the user's action.
            If(
                !varSuppressToggleEvents,
                Reset(tglOperationalState);
                Reset(tglApplicationMode)
            );
            Set(varLedOperationalState, If(varStatusCallError="", "Green", "Gray"));
            Set(varLedApplicationMode, If(varStatusCallError="", "Green", "Gray"));
            // Change-notification LEDs (Critical/Warnings/Agents Active KPI tiles): establish the
            // "last acknowledged" baseline exactly once, on the very first successful refresh of this
            // session. Later refreshes (tmrAutoRefreshTick) deliberately do NOT touch this baseline -
            // only the user clicking a KPI tile (btnAck*/lbl*OnSelect) does. This way, any drift away
            // from the acknowledged baseline (new warning, new critical, agent count change) lights the
            // matching LED again, exactly as requested ("neue Warnung lässt die LED erneut leuchten").
            If(
                !varBaselineAcknowledged && varStatusCallError="",
                Set(varLastAckCriticalCount, Coalesce(varAuditFailedCount,0));
                Set(varLastAckWarningCount, Coalesce(varAuditWarningCount,0));
                Set(varLastAckAgentsHealthyCount, Coalesce(varAgentsHealthyCount,0));
                Set(varBaselineAcknowledged, true)
            );
            // The guard is intentionally NOT lifted here: the toggle's Default-driven OnCheck/OnUncheck
            // reaction to the values just set above can fire a moment later (next render pass), which was
            // still catching the guard as already-lifted and showing a spurious "switched" notification.
            // tmrAutoRefreshTick lifts the guard one full second later instead, safely after that.
            Set(varReadyToLiftToggleGuard, true)
        )
