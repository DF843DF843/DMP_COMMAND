                                          BorderThickness: =3
                                          Color: =If(varDarkMode,RGBA(255,255,255,1),RGBA(20,20,24,1))
                                          Fill: =RGBA(0,0,0,0)
                                          Font: =Font.'Segoe UI'
                                          Height: =32
                                          HoverFill: =RGBA(255,255,255,0.08)
                                          OnSelect: =Set(varConfirmDeleteMailboxFolders,false)
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Text: ="Cancel"
