                        - tmrProcessExternalDomainsReplace:
                            Control: Timer@2.1.0
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Duration: =200
                              Fill: =RGBA(0,0,0,0)
                              Height: =1
                              OnTimerEnd: |-
                                =If(
                                    varTriggerEmergencyUpload,
                                    Set(varTriggerEmergencyUpload, false);
                                    IfError(
                                        Set(
                                            varEmergencyReportUploadResult,
                                            'DMPAgent3.01(EmergencyReportManagement)=>VS'.Run(
                                                User().Email,
                                                {
                                                    file: {
                                                        name: First(attExternalDomainsReplace.Attachments).Name,
                                                        contentBytes: First(attExternalDomainsReplace.Attachments).Value
                                                    }
                                                }
                                            )
                                        ),
                                        Set(
                                            varEmergencyReportUploadResult,
                                            {responsecode: "NO_FLOW_RESPONSE", responsemessage: "Agent 3 did not return a processing result.", responsestatus: "FAILED"}
                                        )
                                    );
                                    If(
                                        Upper(Coalesce(varEmergencyReportUploadResult.responsestatus, "")) = "SUCCESS",
                                        Set(varLedEmergencyReport, "Green");
                                        Notify(Coalesce(varEmergencyReportUploadResult.responsemessage, "Emergency Report uploaded successfully."), NotificationType.Success),
                                        Set(varLedEmergencyReport, "Red");
                                        Notify(Coalesce(varEmergencyReportUploadResult.responsemessage, "Emergency Report processing failed."), NotificationType.Error)
                                    );
                                    Reset(attExternalDomainsReplace)
                                )
                              Repeat: =true
                              AutoStart: =true
                              Start: =true
                              Visible: =true
                              Width: =1
                              X: =4
                              Y: =2
