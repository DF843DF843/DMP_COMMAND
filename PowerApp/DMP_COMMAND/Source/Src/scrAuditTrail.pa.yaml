                      Properties:
                        BorderColor: =RGBA(255,159,10,0.6)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Color: =RGBA(255,159,10,1)
                        Fill: =RGBA(0,0,0,0)
                        Font: =Font.'Arial'
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        HoverFill: =RGBA(255,159,10,0.12)
                        OnSelect: |-
                          =Set(varAuditResetResult, IfError('DMPAgent6(AdminFunctions)'.Run(User().Email,"ResetWarningCounterBaseline"), {success:false, message:"Reset call failed: " & FirstError.Message}));
                          If(
                              varAuditResetResult.success,
                              Set(varStatusResult, IfError('DMPAgent4(StatusCheck)=>VS'.Run(), varStatusResult));
                              Set(varAuditWarningCount, IfError(Coalesce(varStatusResult.auditwarningcount, varAuditWarningCount), varAuditWarningCount));
                              Set(varWarningCounterBaseline, IfError(Coalesce(varStatusResult.warningcounterbaseline, varWarningCounterBaseline), varWarningCounterBaseline));
                              Notify(varAuditResetResult.message, NotificationType.Success),
                              Notify(varAuditResetResult.message, NotificationType.Error)
                          )
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =11
                        Text: ="Reset Warning"
                        Width: =120
                        X: =548
                        Y: =50
