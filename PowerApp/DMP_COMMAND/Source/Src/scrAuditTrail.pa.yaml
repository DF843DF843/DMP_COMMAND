Screens:
  scrAuditTrail:
    Properties:
      Fill: =If(varDarkMode,RGBA(11,11,13,1),RGBA(243,243,243,1))
      LoadingSpinnerColor: =RGBA(0, 206, 125, 1)
      OnVisible: |-
        =Set(varStatusCallError, "");
        Set(varLastAttemptTimestamp, Now());
        Set(varIsRefreshing, true);
        Set(
            varStatusResult,
            IfError(
                'DMPAgent4(StatusCheck)=>VS'.Run(),
                Set(varStatusCallError, FirstError.Message);
                Blank()
            )
        );
        Set(varIsRefreshing, false);
        Set(varStatusLastRefreshed, If(varStatusCallError="", Now(), varStatusLastRefreshed));
        Set(varAuditTrailExists, Coalesce(varStatusResult.audittrailexists, varAuditTrailExists));
        Set(varAuditLastModified, Coalesce(varStatusResult.auditlastmodified, varAuditLastModified));
        Set(varAuditRunSummaryCount, IfError(Coalesce(varStatusResult.auditrunsummarycount, varAuditRunSummaryCount), varAuditRunSummaryCount));
        Set(varAuditWarningCount, IfError(Coalesce(varStatusResult.auditwarningcount, varAuditWarningCount), varAuditWarningCount));
        Set(varAuditFailedCount, IfError(Coalesce(varStatusResult.auditfailedcount, varAuditFailedCount), varAuditFailedCount))
    Children:
      - conAuditTrailRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =If(varDarkMode,RGBA(11,11,13,1),RGBA(243,243,243,1))
            Height: =Parent.Height
            Width: =Parent.Width
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =16
          Children:
            - conAuditTrailHeader:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =RGBA(32,23,81,1)
                  Height: =72
                  LayoutMaxHeight: =72
                  LayoutMinHeight: =72
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                Children:
                  - btnBackToCockpitFromAuditTrail:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(255,255,255,1)
                        Fill: =RGBA(255,255,255,0.12)
                        Font: =Font.'Arial'
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        HoverFill: =RGBA(255,255,255,0.22)
                        OnSelect: =Navigate(scrHome, ScreenTransition.None)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="< Back to Cockpit"
                        Width: =190
                        X: =20
                        Y: =18
                  - lblAuditTrailPageTitle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(255,255,255,1)
                        Font: =Font.'Arial'
                        FontWeight: =FontWeight.Bold
                        Height: =31
                        Size: =20
                        Text: ="Audit Trail (Detail)"
                        Width: =500
                        Wrap: =false
                        X: =230
                        Y: =12
                  - lblAuditTrailPageSubtitle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(215,210,235,1)
                        Font: =Font.'Arial'
                        Height: =20
                        Size: =11.5
                        Text: ="DMP COMMAND - detailed audit trail view"
                        Width: =500
                        Wrap: =false
                        X: =230
                        Y: =42
                  - tmrAuditTrailAutoRefresh:
                      Control: Timer@2.1.0
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Duration: =1000
                        Fill: =RGBA(0,0,0,0)
                        Height: =1
                        OnTimerEnd: |-
                          =If(
                              varAutoRefreshMinutes<=0,
                              Set(varAutoRefreshSecondsRemaining, 0),
                              If(
                                  varAutoRefreshSecondsRemaining<=1,
                                  Set(varAutoRefreshSecondsRemaining, varAutoRefreshMinutes*60);
                                  Set(varStatusCallError, "");
                                  Set(varLastAttemptTimestamp, Now());
                                  Set(varIsRefreshing, true);
                                  Set(
                                      varStatusResult,
                                      IfError(
                                          'DMPAgent4(StatusCheck)=>VS'.Run(),
                                          Set(varStatusCallError, FirstError.Message);
                                          Blank()
                                      )
                                  );
                                  Set(varIsRefreshing, false);
                                  Set(varStatusLastRefreshed, If(varStatusCallError="", Now(), varStatusLastRefreshed));
                                  Set(varAuditTrailExists, Coalesce(varStatusResult.audittrailexists, varAuditTrailExists));
                                  Set(varAuditLastModified, Coalesce(varStatusResult.auditlastmodified, varAuditLastModified));
                                  Set(varAuditRunSummaryCount, IfError(Coalesce(varStatusResult.auditrunsummarycount, varAuditRunSummaryCount), varAuditRunSummaryCount));
                                  Set(varAuditWarningCount, IfError(Coalesce(varStatusResult.auditwarningcount, varAuditWarningCount), varAuditWarningCount));
                                  Set(varAuditFailedCount, IfError(Coalesce(varStatusResult.auditfailedcount, varAuditFailedCount), varAuditFailedCount))
                                  ,
                                  Set(varAutoRefreshSecondsRemaining, varAutoRefreshSecondsRemaining-1)
                              )
                          )
                        Repeat: =true
                        AutoStart: =true
                        Start: =true
                        Visible: =true
                        Width: =1
                        X: =0
                        Y: =0
            - conAuditTrailSummary:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,206,125,0.7)
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =3
                  Fill: =If(varDarkMode,RGBA(255,255,255,0.06),RGBA(32,23,81,0.05))
                  FillPortions: =0
                  Height: =130
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                Children:
                  - lblAuditTrailSummaryCritical:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(209,52,56,1)
                        Font: =Font.'Arial'
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        Size: =16
                        Text: ="Critical (total):" & " " & Coalesce(varAuditFailedCount,0)
                        Width: =260
                        Wrap: =false
                        X: =16
                        Y: =12
                  - lblAuditTrailSummaryWarnings:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(255,159,10,1)
                        Font: =Font.'Arial'
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        Size: =16
                        Text: ="Warnings (total):" & " " & Coalesce(varAuditWarningCount,0)
                        Width: =260
                        Wrap: =false
                        X: =300
                        Y: =12
                  - lblAuditTrailSummaryRunSummary:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                        Font: =Font.'Arial'
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        Size: =16
                        Text: ="Total run-summary rows:" & " " & Coalesce(varAuditRunSummaryCount,0)
                        Width: =320
                        Wrap: =false
                        X: =584
                        Y: =12
                  - lblAuditTrailSummaryHint:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =If(varDarkMode,RGBA(154,154,160,1),RGBA(90,88,100,1))
                        Font: =Font.'Arial'
                        Height: =18
                        Size: =10.5
                        Text: ="The lists below show the 10 most recent rows of each kind, read live from the central Audit Trail on every Cockpit refresh."
                        Width: =900
                        Wrap: =false
                        X: =16
                        Y: =92
                  - lblAuditTrailSinceReset:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                        Font: =Font.'Arial'
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        Size: =13
                        Text: ="New since reset - Critical:" & " " & Max(Coalesce(varAuditFailedCount,0)-Coalesce(varCriticalCounterBaseline,0),0) & "   Warnings:" & " " & Max(Coalesce(varAuditWarningCount,0)-Coalesce(varWarningCounterBaseline,0),0)
                        Width: =380
                        Wrap: =false
                        X: =16
                        Y: =52
                  - btnResetCriticalCounter:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(209,52,56,0.6)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Color: =RGBA(209,52,56,1)
                        Fill: =RGBA(0,0,0,0)
                        Font: =Font.'Arial'
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        HoverFill: =RGBA(209,52,56,0.12)
                        OnSelect: |-
                          =Set(varAuditResetResult, IfError('DMPAgent6(AdminFunctions)'.Run(User().Email,"ResetCriticalCounterBaseline"), {success:false, message:"Reset call failed: " & FirstError.Message}));
                          If(
                              varAuditResetResult.success,
                              Set(varStatusResult, IfError('DMPAgent4(StatusCheck)=>VS'.Run(), varStatusResult));
                              Set(varAuditFailedCount, IfError(Coalesce(varStatusResult.auditfailedcount, varAuditFailedCount), varAuditFailedCount));
                              Set(varCriticalCounterBaseline, IfError(Coalesce(varStatusResult.criticalcounterbaseline, varCriticalCounterBaseline), varCriticalCounterBaseline));
                              Notify(varAuditResetResult.message, NotificationType.Success),
                              Notify(varAuditResetResult.message, NotificationType.Error)
                          )
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =11
                        Text: ="Reset Critical"
                        Width: =120
                        X: =420
                        Y: =50
                  - btnResetWarningCounter:
