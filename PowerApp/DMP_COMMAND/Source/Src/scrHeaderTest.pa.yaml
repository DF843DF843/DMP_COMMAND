      - lblRawDataLabel:
          Control: Label@2.5.1
          Properties:
            X: =20
            Y: =350
            Width: =900
            Height: =20
            Text: ="Raw Agent 4 response (varStatusResult) as JSON - for diagnosing the blank Critical/Warnings/HealthyAgents values:"
            Color: =RGBA(60,60,70,1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Size: =10
            Align: =Align.Left
            BorderStyle: =BorderStyle.None
            BorderColor: =RGBA(0,0,0,0)

      - lblRawJsonDump:
          Control: Label@2.5.1
          Properties:
            X: =20
            Y: =374
            Width: =1300
            Height: =260
            Text: =If(IsBlank(varStatusResult), "varStatusResult is Blank() - the Agent 4 call itself returned nothing", IfError(JSON(varStatusResult, JSONFormat.IndentFour), "JSON() failed - " & FirstError.Message))
            Color: =RGBA(20,20,24,1)
            Fill: =RGBA(255,255,255,1)
            BorderStyle: =BorderStyle.Solid
            BorderColor: =RGBA(200,200,205,1)
            Font: =Font.'Courier New'
            Size: =10
            Align: =Align.Left
            VerticalAlign: =VerticalAlign.Top
            Wrap: =true
