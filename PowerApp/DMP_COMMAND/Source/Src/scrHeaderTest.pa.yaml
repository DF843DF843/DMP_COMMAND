Screens:
  scrHeaderTest:
    Properties:
      Fill: =RGBA(243,243,243,1)
    Children:
      - lblLabTitle:
          Control: Label@2.5.1
          Properties:
            X: =20
            Y: =10
            Width: =900
            Height: =24
            Text: ="HEADER TEST LAB - not linked to navigation, open via the Screens list in Studio"
            Color: =RGBA(90,88,110,1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Size: =11
            Align: =Align.Left
            BorderStyle: =BorderStyle.None
            BorderColor: =RGBA(0,0,0,0)

      - lblVariantALabel:
