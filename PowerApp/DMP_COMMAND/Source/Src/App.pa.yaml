App:
  Properties:
    OnStart: |-
      =// Variables Declaration
      Set(varConfirmVisible,false);
      Set(varPendingAction,"");
      Set(varIsRealDMP,false);
      Set(varRequestedMode,false);
      Set(varSuppressToggleEvents,true);
      Set(varStartDMPStatusRefresh,false);
      Set(varOperationalModeIsDMP,false);
      Set(varOperationalMode,"Normal");
      Set(varOperationalStepCounter,0);
      Set(varOperationalModeWasNormalBeforeEnvSwitch,true);
      Set(varEnvironmentIsPROD,false);
      Set(varLedOperationalState,"Gray");
      Set(varLedApplicationMode,"Gray");
      Set(varLedEmergencyReport,"Gray");
      Set(varBlinkPhase,true);
      Set(varLastChangedText,Blank());

      Set(varShowAdminPanel,false);
      Set(varConfirmDeleteMailboxFolders,false);
      Set(varAdminActionResult,{success:false,message:"",requestedaction:"",deletedcount:0});
      Set(varAuditResetResult,{success:false,message:"",requestedaction:"",deletedcount:0});
      Set(varConfirmResetCounter,false);
      Set(varPendingResetAction,"");
      Set(varPendingResetLabel,"");
      Set(varShowEmailsLegend,false);
      Set(varReleaseNotesTab,"App");
      Set(varTriggerEmergencyUpload,false);
      // Release Notes detail-pane selector: previously never initialized and had no matching
      // Switch case for any version after v1.22.13, so it silently always fell back to showing
      // v1.22.13 (found 2026-09-22 from user feedback "Agent 7 missing, shows old version").
      // Defaults to the newest App version now; keep this in sync with the current version.
      Set(varSelectedAppRelease,"V12232");
      // Same bug, same fix, Agent tab: varSelectedAgentRelease was never initialized and had no
      // Switch case/menu button for Agent 7 - defaulted to Agent 1 instead of the newest agent.
      Set(varSelectedAgentRelease,"7");

      // B3 Default Case Context popup (mandatory form on Pre-Default -> DMP transition).
      // 'DMP Command Default Case Context' SharePoint list connected as a live Power App data
      // source 2026-09-23 (site GO365_DMPCommunication-CoSLeader, GUID
      // 8fa1f858-3f89-4600-b3dc-86f9dfcaf4b8). Popup now Patches this list directly - no local
      // collection is used any more (colDefaultCaseContextPending removed).
      Set(varShowDefaultCaseContextPopup,false);
      Set(varDefaultCaseContextConfirmedForThisAdvance,false);
      Set(varDefaultCaseContextValidationError,"");
      Set(varDefaultCaseContextPatchResult,Blank());

      // C6/C7: Task Occurrences four-eyes status-change workflow.
      // 'DMP Command Checklist Task Occurrences' connected as a live Power App data source
      // 2026-09-23. scrTaskOccurrences now Patches this list directly - no local collection is
      // used any more (colTaskOccurrencesPreview removed). Note: Title holds the OccurrenceId
      // business key (the list has no separate OccurrenceId column).
      // Known open gap (flag to user before going live): the real list has no "PreviousStatus"
      // field, so a Reject currently only clears the pending approval state - it does not revert
      // Status to what it was before the proposal. Decide with the user whether a PreviousStatus
      // field should be added, or whether Reject requiring a fresh manual re-propose is acceptable.

      // Change-notification LEDs (Critical/Warnings/Agents Active KPI tiles in scrHome's header):
      // varBaselineAcknowledged is set true exactly once, on the first successful status refresh
      // (see scrHome.OnVisible) - that is when varLastAck* is populated with the then-current values.
      // From then on, any KPI value that drifts away from its varLastAck* baseline lights the matching
      // LED, until the user acknowledges it (click on the KPI tile sets varLastAck* = current value).
      Set(varLastAckCriticalCount,0);
      Set(varLastAckWarningCount,0);
      Set(varLastAckAgentsHealthyCount,6);
      Set(varBaselineAcknowledged,false);

      Set(varEmergencyReportExists,false);
      Set(varEmergencyReportLastModified,Blank());

      Set(varInternalDomainsExists,false);
      Set(varInternalDomainsCount,0);
      Set(varInternalDomainsLastModified,Blank());

      Set(varExternalDomainsExists,false);
      Set(varExternalDomainsCount,0);
      Set(varExternalDomainsLastModified,Blank());

      Set(varCounterExists,false);
      Set(varCounterNoDMP,0);
      Set(varCounterInternalSender,0);
      Set(varCounterNotEffected,0);
      Set(varCounterEffected,0);
      Set(varCounterLastModified,Blank());

      Set(varAuditTrailExists,false);
      Set(varAuditRunSummaryCount,0);
      Set(varAuditWarningCount,0);
      Set(varAuditFailedCount,0);
      Set(varCriticalCounterBaseline,0);
      Set(varWarningCounterBaseline,0);
      Set(varAuditLastRunTimestamp,"");
      Set(varAuditLastSuccessTimestamp,"");
      Set(varAuditLastFailedTimestamp,"");
      Set(varAuditLastModified,Blank());

      Set(varAgent6Healthy,true);
      Set(varAgent7Healthy,true);

      Set(varNextMilestones,Filter(Table({phase:"",milestone:"",responsibility:"",status:""}),false));

      Set(varEmergencyReportUploadResult,Blank());
      Set(varOpModeResult,Blank());
      Set(varDarkMode,true);
      Set(varAppVersion,"");
      Set(varStatusLastRefreshed,Blank());
      Set(varAutoRefreshMinutes,0);
      Set(varAutoRefreshSecondsRemaining,0);
      Set(varReadyToLiftToggleGuard,false);
      Set(varIsRefreshing,false);
      Set(varLastAttemptTimestamp,Blank());
      Set(varInitialRefreshDone,false);
      Set(varInitialRefreshAttempts,0);
      Set(varStatusCallError, "")

      // NOTE: The actual Agent 4 status refresh call is deliberately NOT made here in App.OnStart.
      // Data source connections are not always fully ready at this very early point in the app lifecycle,
      // which caused the initial automatic refresh to silently fail while a later manual call worked fine.
      // See scrHome.OnVisible for the real first refresh call (runs once the screen is actually loaded) -
      // that is also where varSuppressToggleEvents is finally lifted, once real Agent 4 values are in.
      // varInitialRefreshDone is now only set to true on a SUCCESSFUL call (or after 15 failed retries,
      // ~12s via tmrInitialKickstart) - previously it was set unconditionally on the very first attempt,
      // so one early failure permanently blocked all further retries (see scrHome.OnVisible comment).
    StartScreen: =scrHome
    Theme: =PowerAppsTheme
