                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblManualNextStepsHeader:
                            Control: Label@2.5.1
