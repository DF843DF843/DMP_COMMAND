                              AutoHeight: =true
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                              Font: =Font.'Segoe UI'
                              Height: =80
                              Size: =12
                              Text: ="A short, manually curated list of upcoming or in-progress project milestones - purely informational, no live data."
                              Wrap: =true
                  - conManualSidebar:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0,206,125,0.5)
                        BorderThickness: =2
                        Fill: =If(varDarkMode,RGBA(255,255,255,0.06),RGBA(32,23,81,0.05))
                        LayoutAlignItems: =LayoutAlignItems.Stretch
