                        RadiusTopRight: =12
                      Children:
                        - lblManualSidebarHeader:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0,206,125,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              Size: =16
                              Text: ="Sidebar navigation"
                              Wrap: =false
                        - lblManualSidebarNotes:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                              Font: =Font.'Segoe UI'
                              Height: =220
                              Size: =12
                              Text: ="- Cockpit - the main overview screen described above" & Char(10) & "- Agent Monitoring - live per-agent tiles (status, last run result and duration, message) straight from the DMP Command Agent Status list" & Char(10) & "- Help / Operational Manual - this page" & Char(10) & "- Audit Trail (Detail) - the full audit log with the Critical/Warnings drill-down" & Char(10) & "- Configuration (Lists) - direct access to the underlying SharePoint configuration lists" & Char(10) & "- Maintenance - system/connection diagnostics and useful admin links" & Char(10) & "- Admin Functions - counter resets and other administrative actions (use with care)"
                              Wrap: =true
