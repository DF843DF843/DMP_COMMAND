Screens:
  scrOperationalBoard:
    Properties:
      Fill: =If(varDarkMode,RGBA(11,11,13,1),RGBA(243,243,243,1))
      LoadingSpinnerColor: =RGBA(0, 206, 125, 1)
    Children:
      - conOperationalBoardRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =If(varDarkMode,RGBA(11,11,13,1),RGBA(243,243,243,1))
            Height: =Parent.Height
            Width: =Parent.Width
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =16
          Children:
            - conOperationalBoardHeader:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =RGBA(32,23,81,1)
                  Height: =72
                  LayoutMaxHeight: =72
                  LayoutMinHeight: =72
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                Children:
                  - btnBackToCockpitFromOperationalBoard:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(255,255,255,1)
                        Fill: =RGBA(255,255,255,0.12)
                        Font: =Font.'Arial'
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        HoverFill: =RGBA(255,255,255,0.22)
                        OnSelect: =Navigate(scrHome, ScreenTransition.None)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="< Back to Cockpit"
                        Width: =190
                        X: =20
                        Y: =18
                  - lblOperationalBoardPageTitle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(255,255,255,1)
                        Font: =Font.'Arial'
                        FontWeight: =FontWeight.Bold
                        Height: =31
                        Size: =20
                        Text: ="Help / Operational Manual"
                        Width: =500
                        Wrap: =false
                        X: =230
                        Y: =12
                  - lblOperationalBoardPageSubtitle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(215,210,235,1)
                        Font: =Font.'Arial'
                        Height: =20
                        Size: =11.5
                        Text: ="DMP COMMAND - how the Cockpit works, container by container"
                        Width: =500
                        Wrap: =false
                        X: =230
                        Y: =42
            - conOperationalManualList:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Visible: =false
                  Fill: =RGBA(0,0,0,0)
                  FillPortions: =1
                  Height: =Parent.Height - 120
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMaxHeight: =Parent.Height - 120
                  LayoutMinHeight: =Parent.Height - 120
                  LayoutOverflowY: =LayoutOverflow.Scroll
                Children:
                  - conManualIntro:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0,206,125,0.5)
                        BorderThickness: =2
                        Fill: =If(varDarkMode,RGBA(255,255,255,0.06),RGBA(32,23,81,0.05))
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblManualIntroHeader:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0,206,125,1)
                              Font: =Font.'Arial'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              Size: =16
                              Text: ="About this manual"
                              Wrap: =false
                        - lblManualIntroNotes:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                              Font: =Font.'Arial'
                              Height: =70
                              Size: =12
                              Text: ="This page explains what every container on the DMP COMMAND Cockpit shows, how to read its status colours, and what each button does. Scroll down for a section on each container, in the same order they appear on the Cockpit (top to bottom, left to right). For release history see ""Release Notes""; for per-agent live health see ""Agent Monitoring""."
                              Wrap: =true
                  - conManualGeneralColours:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0,206,125,0.5)
                        BorderThickness: =2
                        Fill: =If(varDarkMode,RGBA(255,255,255,0.06),RGBA(32,23,81,0.05))
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblManualGeneralColoursHeader:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0,206,125,1)
                              Font: =Font.'Arial'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              Size: =16
                              Text: ="General colour / LED convention"
                              Wrap: =false
                        - lblManualGeneralColoursNotes:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                              Font: =Font.'Arial'
                              Height: =140
                              Size: =12
                              Text: ="Every small round dot on the Cockpit follows the same rule everywhere:" & Char(10) & "- Green dot - the item is present / OK / operational" & Char(10) & "- Red dot - the item is missing / not OK / an error was detected" & Char(10) & "- Yellow / blinking dot (Replace button only) - a file upload is currently being processed by the agent, please wait" & Char(10) & "- Rings (System Health, Emails Processed) show the same green/blue/purple colours split proportionally instead of a single dot, so you can see the mix at a glance" & Char(10) & "All dots are the same 14x14 pixel circle across every container for visual consistency."
                              Wrap: =true
                  - conManualTopBar:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0,206,125,0.5)
                        BorderThickness: =2
                        Fill: =If(varDarkMode,RGBA(255,255,255,0.06),RGBA(32,23,81,0.05))
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblManualTopBarHeader:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0,206,125,1)
                              Font: =Font.'Arial'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              Size: =16
                              Text: ="Top bar"
                              Wrap: =false
                        - lblManualTopBarNotes:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                              Font: =Font.'Arial'
                              Height: =120
                              Size: =12
                              Text: ="- ""DMP COMMAND"" title and the DMP / Normal mode indicator show the current operation mode at a glance (see ""Operating State"" below for the full explanation)" & Char(10) & "- The DARK / LIGHT toggle switches the whole app's colour theme; your choice is remembered for the session" & Char(10) & "- The clock/refresh area ticks once per second in the background - it is what keeps every live tile (Operating State, Maintenance Domains, Files, System Health, Emails Processed) up to date without needing a manual refresh"
                              Wrap: =true
                  - conManualOperatingState:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0,206,125,0.5)
                        BorderThickness: =2
                        Fill: =If(varDarkMode,RGBA(255,255,255,0.06),RGBA(32,23,81,0.05))
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblManualOperatingStateHeader:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0,206,125,1)
                              Font: =Font.'Arial'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              Size: =16
                              Text: ="Operating State container"
                              Wrap: =false
                        - lblManualOperatingStateNotes:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                              Font: =Font.'Arial'
                              Height: =180
                              Size: =12
                              Text: ="- OPERATING STATE - the raw value read live from the ""DMP Command Configuration"" SharePoint list, i.e. what the backend agents currently believe the system state is" & Char(10) & "- LAST CHANGED - timestamp of the last write to that same configuration value, so you can tell a stale reading from a fresh one" & Char(10) & "- MODE toggle (Normal / DMP) - shows whether the mailbox is running in normal day-to-day processing or in DMP (Domain Maintenance Process) mode; DMP mode changes how Agent 1 and 2 classify incoming e-mail domains" & Char(10) & "- ENVIRONMENT toggle (SIMU / PROD) - shows whether the connected mailbox is the simulation mailbox or the real production mailbox - always double-check this before assuming a test action is safe"
                              Wrap: =true
                  - conManualMaintenanceDomains:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0,206,125,0.5)
                        BorderThickness: =2
                        Fill: =If(varDarkMode,RGBA(255,255,255,0.06),RGBA(32,23,81,0.05))
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblManualMaintenanceDomainsHeader:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0,206,125,1)
                              Font: =Font.'Arial'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              Size: =16
                              Text: ="Maintenance Domains container"
                              Wrap: =false
                        - lblManualMaintenanceDomainsNotes:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                              Font: =Font.'Arial'
                              Height: =180
                              Size: =12
                              Text: ="- INTERNAL - number of domains in the ""DMP Command Internal Domains"" SharePoint list marked Active; these are the domains treated as belonging to Deutsche Boerse itself" & Char(10) & "- EXTERNAL - number of domains in the external domains reference file; these are known outside partner domains" & Char(10) & "- The status dot in front of each count is green when the underlying source is reachable, red when it could not be read" & Char(10) & "- View opens the SharePoint list / file to browse all entries" & Char(10) & "- Edit opens a quick ""add new domain"" form (Internal) or the file directly (External) - both open in a new browser tab"
                              Wrap: =true
                  - conManualFiles:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0,206,125,0.5)
                        BorderThickness: =2
                        Fill: =If(varDarkMode,RGBA(255,255,255,0.06),RGBA(32,23,81,0.05))
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblManualFilesHeader:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0,206,125,1)
                              Font: =Font.'Arial'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              Size: =16
                              Text: ="Files container"
                              Wrap: =false
                        - lblManualFilesNotes:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                              Font: =Font.'Arial'
                              Height: =220
                              Size: =12
                              Text: ="Lists the 2 real working files the agents still depend on, each with a status dot (green = found, red = missing) and a ""last updated"" timestamp:" & Char(10) & "- Emergency Report - produced by Agent 3 when a mailbox emergency is detected" & Char(10) & "- Audit Trail File - the full log of every automated action taken (see ""Audit Trail"")" & Char(10) & "- Replace button - lets you manually upload a new Emergency Report file; the dot turns yellow and blinks while the upload is being processed by the agent, then returns to green once done" & Char(10) & Char(10) & "Counter and External Domains moved to the Automation Status container below - both are now SharePoint lists, not files."
                              Wrap: =true
                  - conManualSystemHealth:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0,206,125,0.5)
                        BorderThickness: =2
                        Fill: =If(varDarkMode,RGBA(255,255,255,0.06),RGBA(32,23,81,0.05))
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblManualSystemHealthHeader:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0,206,125,1)
                              Font: =Font.'Arial'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              Size: =16
                              Text: ="System Health ring"
                              Wrap: =false
                        - lblManualSystemHealthNotes:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                              Font: =Font.'Arial'
                              Height: =180
                              Size: =12
                              Text: ="A single ring that is fully green when all 5 underlying items are OK, and shows a red slice for every one that is missing:" & Char(10) & "Emergency Report, Internal Domains, External Domains, Counter, Audit Trail File." & Char(10) & "Click the ring (or the info icon) to open the detailed legend popup, which lists each of the 5 items with its own OK/Missing status - this is the fastest way to see exactly what is wrong when the ring is not fully green."
                              Wrap: =true
                  - conManualEmailsProcessed:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0,206,125,0.5)
                        BorderThickness: =2
                        Fill: =If(varDarkMode,RGBA(255,255,255,0.06),RGBA(32,23,81,0.05))
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblManualEmailsProcessedHeader:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0,206,125,1)
                              Font: =Font.'Arial'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              Size: =16
                              Text: ="Emails Processed ring"
                              Wrap: =false
                        - lblManualEmailsProcessedNotes:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                              Font: =Font.'Arial'
                              Height: =180
                              Size: =12
                              Text: ="Shows the running split of every e-mail Agent 2 has classified since the counters were last reset, as a proportional ring with 4 categories:" & " " & "No DMP, External, Internal Sender and Not Effected." & Char(10) & "Click the ring to open the legend popup, which lists the exact count and percentage for each of the 4 categories - useful for spotting an unusual spike (e.g. a sudden jump in ""No DMP"" e-mails)."
                              Wrap: =true
                  - conManualAutomationStatus:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0,206,125,0.5)
                        BorderThickness: =2
                        Fill: =If(varDarkMode,RGBA(255,255,255,0.06),RGBA(32,23,81,0.05))
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblManualAutomationStatusHeader:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0,206,125,1)
                              Font: =Font.'Arial'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              Size: =16
                              Text: ="Automation Status container"
                              Wrap: =false
                        - lblManualAutomationStatusNotes:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                              Font: =Font.'Arial'
                              Height: =220
                              Size: =12
                              Text: ="A compact 6-line summary read live from SharePoint / Dataverse:" & Char(10) & "- Agent 4 Live Status - the current status word reported by Agent 4's last status check run" & Char(10) & "- Internal Domains active count - how many domains in the SharePoint list are marked Active" & Char(10) & "- Config Parameters active count - how many rows in ""DMP Command Configuration"" are marked Active" & Char(10) & "- Agent Status entries count - how many agent rows exist in ""DMP Command Agent Status""" & Char(10) & "- Counter rows count - how many rows exist in ""DMP Command Counters"" (normally 4)" & Char(10) & "- External Domains rows count - how many domains are currently listed in ""DMP Command External Domains"""
                              Wrap: =true
                  - conManualNextSteps:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0,206,125,0.5)
                        BorderThickness: =2
                        Fill: =If(varDarkMode,RGBA(255,255,255,0.06),RGBA(32,23,81,0.05))
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblManualNextStepsHeader:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0,206,125,1)
                              Font: =Font.'Arial'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              Size: =16
                              Text: ="Next Steps container"
                              Wrap: =false
                        - lblManualNextStepsNotes:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                              Font: =Font.'Arial'
                              Height: =80
                              Size: =12
                              Text: ="A short, manually curated list of upcoming or in-progress project milestones - purely informational, no live data."
                              Wrap: =true
                  - conManualSidebar:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(0,206,125,0.5)
                        BorderThickness: =2
                        Fill: =If(varDarkMode,RGBA(255,255,255,0.06),RGBA(32,23,81,0.05))
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblManualSidebarHeader:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0,206,125,1)
                              Font: =Font.'Arial'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              Size: =16
                              Text: ="Sidebar navigation"
                              Wrap: =false
                        - lblManualSidebarNotes:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =If(varDarkMode,RGBA(220,218,230,1),RGBA(40,38,50,1))
                              Font: =Font.'Arial'
                              Height: =220
                              Size: =12
                              Text: ="- Cockpit - the main overview screen described above" & Char(10) & "- Agent Monitoring - live per-agent tiles (status, last run result and duration, message) straight from the DMP Command Agent Status list" & Char(10) & "- Help / Operational Manual - this page" & Char(10) & "- Audit Trail (Detail) - the full audit log with the Critical/Warnings drill-down" & Char(10) & "- Configuration (Lists) - direct access to the underlying SharePoint configuration lists" & Char(10) & "- Maintenance - system/connection diagnostics and useful admin links" & Char(10) & "- Admin Functions - counter resets and other administrative actions (use with care)"
                              Wrap: =true
            - conOperationalManualSplit:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
